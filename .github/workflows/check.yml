name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/requirements-print-v6.txt
      - run: npm run check
      - run: npm run build
      - run: npm run check
      - run: npm run standalone
